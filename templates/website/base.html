{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Rv sweets and restaurant{% endblock %}</title>
    <meta
        name="description"
        content="Rv sweets and restaurant serves handcrafted Indian sweets, family dining, and catering for celebrations."
    >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'website/css/styles.css' %}?v=5">
</head>
<body>
    {% block content %}{% endblock %}
    <script src="{% static 'website/js/main.js' %}"></script>
</body>
</html>
